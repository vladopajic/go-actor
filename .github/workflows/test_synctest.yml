name: test synctest
on: [push]
permissions:
  contents: read
jobs:
  synctest:
    name: synctest
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: setup go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
    
      - name: replace go version
        run: go mod edit -go=1.27 && grep '^go ' go.mod

      - name: test
        run: |
          go test -tags "synctest" -run Synctest$ -timeout=20s -race -count=10 -shuffle=on -failfast -v ./...
